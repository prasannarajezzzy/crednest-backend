[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/terms"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/privacy"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/blog"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Permanent redirects live in public/_redirects so local and Netlify outputs share one map.
